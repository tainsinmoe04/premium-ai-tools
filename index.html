<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tain Sin Moe | Premium AI Tools</title>
    <style>
      /* Base Setup & Variables */
      @import url("https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;600;700&display=swap");

      :root {
        /* Neutral Dark Backgrounds for Premium Feel */
        --bg-deep: #070707;
        --card-bg: rgba(255, 255, 255, 0.02);
        --border-color: rgba(255, 255, 255, 0.08);

        /* CEO's Blue Palette strictly for Accents */
        --accent-primary: #7692ff; /* Cornflower Blue */
        --accent-glow: rgba(118, 146, 255, 0.15); /* Soft Blue Glow */
        --text-highlight: #abd2fa; /* Icy Blue for Prices */

        --text-main: #ffffff;
        --text-muted: #888888;
      }

      body {
        background-color: var(--bg-deep);
        color: var(--text-main);
        font-family: "Space Grotesk", sans-serif;
        margin: 0;
        padding: 40px 20px;
        /* Very subtle blue glow only at the top center */
        background-image: radial-gradient(
          circle at 50% -20%,
          rgba(27, 44, 193, 0.15),
          transparent 50%
        );
        min-height: 100vh;
      }

      /* Profile Header */
      .profile-header {
        text-align: center;
        margin-bottom: 50px;
      }

      .profile-pic {
        width: 80px;
        height: 80px;
        border-radius: 50%;
        background: linear-gradient(135deg, #222, #000);
        margin: 0 auto 15px auto;
        border: 2px solid var(--accent-primary);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 28px;
        font-weight: 700;
        color: #fff;
        box-shadow: 0 0 20px var(--accent-glow);
      }

      .profile-header h1 {
        font-size: 2.2rem;
        font-weight: 700;
        margin: 0 0 5px 0;
        letter-spacing: -0.5px;
        color: #fff;
      }

      .profile-header p {
        color: var(--text-muted);
        font-size: 0.95rem;
        max-width: 420px;
        margin: 0 auto;
        line-height: 1.6;
      }

      /* Filter Buttons (JS interactive) */
      .filters {
        display: flex;
        justify-content: center;
        gap: 12px;
        margin-bottom: 40px;
        flex-wrap: wrap;
      }

      .filter-btn {
        background: transparent;
        border: 1px solid var(--border-color);
        color: var(--text-muted);
        padding: 8px 18px;
        border-radius: 30px;
        cursor: pointer;
        font-family: "Space Grotesk", sans-serif;
        font-size: 0.9rem;
        transition: all 0.3s ease;
      }

      .filter-btn.active,
      .filter-btn:hover {
        background: var(--text-main);
        color: var(--bg-deep);
        border-color: var(--text-main);
        font-weight: 600;
      }

      /* Grid Layout */
      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
        gap: 24px;
        max-width: 1000px;
        margin: 0 auto;
      }

      /* Product Cards */
      .card {
        background: var(--card-bg);
        border: 1px solid var(--border-color);
        border-radius: 16px;
        padding: 26px;
        backdrop-filter: blur(12px);
        transition: 0.4s ease;
        position: relative;
        display: flex;
        flex-direction: column;
      }

      .card:hover {
        transform: translateY(-6px);
        border-color: var(--accent-primary);
        box-shadow: 0 12px 30px var(--accent-glow);
        background: rgba(255, 255, 255, 0.04);
      }

      .card-price {
        font-size: 1.6rem;
        font-weight: 700;
        margin-bottom: 12px;
        color: var(--text-highlight);
      }

      .card-title {
        font-size: 1.15rem;
        font-weight: 600;
        margin: 0 0 10px 0;
        color: #fff;
      }

      .card-desc {
        font-size: 0.9rem;
        color: var(--text-muted);
        line-height: 1.6;
        margin-bottom: 24px;
        flex-grow: 1;
      }

      /* Badges for Warranty */
      .badge {
        display: inline-block;
        padding: 5px 10px;
        font-size: 0.75rem;
        border-radius: 6px;
        font-weight: 600;
        margin-bottom: 16px;
        background: rgba(255, 255, 255, 0.05);
        color: #aaa;
      }

      .badge.no-warranty {
        background: rgba(255, 80, 80, 0.1);
        color: #ff6b6b;
        border: 1px solid rgba(255, 80, 80, 0.2);
      }

      .badge.good-warranty {
        background: rgba(118, 146, 255, 0.1);
        color: var(--accent-primary);
        border: 1px solid rgba(118, 146, 255, 0.3);
      }

      /* Order Button */
      .btn-order {
        background: transparent;
        color: var(--text-highlight);
        border: 1px solid var(--accent-primary);
        padding: 12px;
        text-align: center;
        border-radius: 8px;
        text-decoration: none;
        font-weight: 600;
        transition: 0.3s;
        cursor: pointer;
        width: 100%;
        box-sizing: border-box;
        display: block;
      }

      .btn-order:hover {
        background: var(--accent-primary);
        color: var(--bg-deep);
        box-shadow: 0 0 15px var(--accent-glow);
      }

      /* Animation */
      @keyframes fadeIn {
        from {
          opacity: 0;
          transform: translateY(15px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
      .fade-in {
        animation: fadeIn 0.4s ease forwards;
      }
    </style>
  </head>
  <body>
    <div class="profile-header">
      <div class="profile-pic">
        <img
          src="./profile.jpg.jpg"
          style="
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
          "
          alt="Profile Picture"
        />
      </div>
      <h1>Tain Sin Moe</h1>
      <p>
        Providing premium digital licenses & AI tools. Direct upgrades, secure
        payments, and reliable support.
      </p>
    </div>

    <div class="filters">
      <button class="filter-btn active" onclick="filterData('all')">
        All Access
      </button>
      <button class="filter-btn" onclick="filterData('google')">
        Google AI
      </button>
      <button class="filter-btn" onclick="filterData('ai')">Other AI</button>
      <button class="filter-btn" onclick="filterData('creative')">
        Creative
      </button>
    </div>

    <div class="grid" id="productGrid"></div>

   <script>
        const products = [
            { id: 1, name: "Google AI Pro (1 Year)", price: "30,000 Ks", desc: "Mail + Password ခဏပေးရပါမည်။", category: "google", warranty: "Standard", warrantyType: "normal" },
            { id: 2, name: "Google AI Pro (4 Months)", price: "20,000 Ks", desc: "Mail + Password ခဏပေးရပါမည်။", category: "google", warranty: "Standard", warrantyType: "normal" },
            { id: 3, name: "Google AI Pro (1 Year) Premium", price: "42,000 Ks", desc: "Ready Use Acc ပေးပါမည်။ Own acc အပိုင်ရမည်၊ ရှယ်သုံးရတာမဟုတ်ပါ။", category: "google", warranty: "1 Month Warranty", warrantyType: "good-warranty" },
            { id: 4, name: "Google AI Pro (4 Months) Premium", price: "40,000 Ks", desc: "Ready Use Acc ပေးပါမည်။ Own acc အပိုင်ရမည်၊ ရှယ်သုံးရတာမဟုတ်ပါ။", category: "google", warranty: "2 Months Warranty", warrantyType: "good-warranty" },
            { id: 5, name: "Google AI Ultra Plan", price: "45,000 Ks / 90,000 Ks", desc: "25000 Flow Credit ပါဝင်ပါသည်။", category: "google", warranty: "Official Plan", warrantyType: "good-warranty" },
            { id: 6, name: "Supergrok", price: "35,000 Ks", desc: "Grok AI Premium Access.", category: "ai", warranty: "Standard", warrantyType: "normal" },
            { id: 7, name: "ChatGPT Plus", price: "35,000 Ks", desc: "Account အဟောင်းမှာ သက်တမ်းတိုးလို့ရပါတယ်။", category: "ai", warranty: "No Warranty ⚠️", warrantyType: "no-warranty" },
            { id: 8, name: "Canva Pro (6 Months)", price: "50,000 Ks", desc: "Private Account (No Edu). Premium features အားလုံးအသုံးပြုနိုင်ပါသည်။", category: "creative", warranty: "6 Months Support", warrantyType: "good-warranty" },
            { id: 9, name: "Capcut Pro", price: "23,000 Ks", desc: "Whole - 3 Devices အသုံးပြုနိုင်ပါသည်။", category: "creative", warranty: "Standard", warrantyType: "normal" },
            { id: 10, name: "Dremina Seedance 2.0 AI", price: "Ask for Price", desc: "1200+ AI Credits ပါဝင်ပါသည်။", category: "creative", warranty: "Standard", warrantyType: "normal" },
            { id: 11, name: "Japan Tiktok", price: "12,000 Ks", desc: "Japan Region အထူးပြု Access.", category: "creative", warranty: "Standard", warrantyType: "normal" }
        ];

        
        const telegramUsername = "tainsinmoe";

        function renderProducts(category) {
            const grid = document.getElementById('productGrid');
            grid.innerHTML = ''; 
            
            const filteredProducts = category === 'all' ? products : products.filter(p => p.category === category);

            filteredProducts.forEach((product, index) => {
                const card = document.createElement('div');
                card.className = 'card fade-in';
                card.style.animationDelay = `${index * 0.04}s`; 
                
                // 💡 ဖုန်းရော PC ပါ အဆင်ပြေအောင် အသစ်ပြင်ထားတဲ့ အပိုင်း
                const rawMessage = `Hello Tain Sin Moe!\n\nI would like to order:\n📦 ${product.name}\n💰 Price: ${product.price}\n\nPlease let me know how to proceed with the payment.`;
                const safeMessage = encodeURIComponent(rawMessage);
                const tgLink = `https://t.me/${telegramUsername}?text=${safeMessage}`;

                card.innerHTML = `
                    <div class="card-price">${product.price}</div>
                    <div class="badge ${product.warrantyType}">${product.warranty}</div>
                    <h2 class="card-title">${product.name}</h2>
                    <p class="card-desc">${product.desc}</p>
                    <a href="${tgLink}" target="_blank" class="btn-order">Order via Telegram</a>
                `;
                grid.appendChild(card);
            });
        }

        function filterData(category) {
            const buttons = document.querySelectorAll('.filter-btn');
            buttons.forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');
            renderProducts(category);
        }

        renderProducts('all');
    </script>
  </body>
</html>
